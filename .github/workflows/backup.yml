name: Respaldo diario de la base de datos

# Respaldo gratuito con pg_dump (respaldo desde Fase 0, no negociable).
# Requisito único: en GitHub → Settings → Secrets and variables → Actions,
# crear el secreto  SUPABASE_DB_URL  con la cadena de conexión "Session pooler"
# (IPv4) de Supabase. Los runners de GitHub no tienen IPv6, así que la conexión
# directa NO funciona: usa el Session pooler.
#
# GitHub envía un correo al dueño del repo si una ejecución programada falla,
# así que la alerta ya está cubierta sin piezas extra.

on:
  schedule:
    - cron: '0 7 * * *'        # 07:00 UTC = 02:00 America/Bogota, cada día
  workflow_dispatch: {}         # permite lanzarlo a mano desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Volcar la base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Falta el secreto SUPABASE_DB_URL"; exit 1; }
          STAMP=$(date -u +%Y-%m-%d)
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -Fc -f "backup-$STAMP.dump"
          ls -lh "backup-$STAMP.dump"

      - name: Guardar el volcado (retención 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.dump
          retention-days: 90
