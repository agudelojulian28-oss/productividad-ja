name: Respaldo diario de la base de datos

# Respaldo gratuito con pg_dump (respaldo desde Fase 0, no negociable).
# Requisito único: secreto SUPABASE_DB_URL con la cadena "Session pooler" (IPv4)
# de Supabase (los runners de GitHub no tienen IPv6).
# Usa el contenedor oficial postgres:17 para que pg_dump iguale al servidor (PG17).
# GitHub avisa por correo al dueño del repo si una ejecución programada falla.

on:
  schedule:
    - cron: '0 7 * * *'        # 07:00 UTC = 02:00 America/Bogota, cada día
  workflow_dispatch: {}         # permite lanzarlo a mano desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Volcar la base de datos (pg_dump 17 vía Docker)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Falta el secreto SUPABASE_DB_URL"; exit 1; }
          STAMP=$(date -u +%Y-%m-%d)
          docker run --rm --entrypoint pg_dump -v "$PWD:/out" postgres:17 \
            "$SUPABASE_DB_URL" --no-owner --no-privileges -Fc -f "/out/backup-$STAMP.dump"
          ls -lh "backup-$STAMP.dump"

      - name: Guardar el volcado (retención 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.dump
          retention-days: 90
